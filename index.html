<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>AR Muzilli - Técnica N°20</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        /* Cámara del celular */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            z-index: 0;
        }

        /* Escena 3D */
        a-scene {
            position: fixed !important;
            top: 0;
            left: 0;

            width: 100vw !important;
            height: 100vh !important;

            z-index: 1;
        }

        /* Información superior */
        #ui-container {
            position: fixed;
            top: 15px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(0, 0, 0, 0.75);
            color: white;

            padding: 12px 18px;

            border-radius: 10px;

            font-family: Arial, sans-serif;
            font-size: 14px;

            z-index: 1000;

            text-align: center;

            max-width: 85%;
        }

        /* Panel informativo de los puntos interactivos */
        #panel-info {
            display: none;

            position: fixed;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(255, 255, 255, 0.96);

            padding: 20px;

            border-radius: 15px;

            width: 80%;
            max-width: 350px;

            z-index: 2000;

            font-family: Arial, sans-serif;

            box-shadow: 0 4px 15px rgba(0,0,0,0.4);

            text-align: center;
        }
    </style>
</head>


<body>


    <!-- ====================================================== -->
    <!-- CAMARA DEL CELULAR -->
    <!-- ====================================================== -->

    <video
        id="video-background"
        autoplay
        playsinline
        muted>
    </video>



    <!-- ====================================================== -->
    <!-- ESTADO -->
    <!-- ====================================================== -->

    <div id="ui-container">
        <span id="status">
            Cargando maqueta del colegio...
        </span>
    </div>



    <!-- ====================================================== -->
    <!-- PANEL DE INFORMACION -->
    <!-- ====================================================== -->

    <div id="panel-info">

        <h2
            id="info-titulo"
            style="
                margin: 0 0 10px 0;
                color: #333;
            ">
            Título
        </h2>

        <p
            id="info-texto"
            style="
                margin: 0 0 15px 0;
                color: #555;
                line-height: 1.4;
            ">
            Texto
        </p>

        <div id="panel-botones"></div>

    </div>



    <!-- ====================================================== -->
    <!-- ESCENA A-FRAME -->
    <!-- ====================================================== -->

    <a-scene

        embedded

        vr-mode-ui="enabled: false"

        color-space="sRGB"

        renderer="
            alpha: true;
            antialias: true;
        "

        background="transparent: true"

        cursor="rayOrigin: mouse"

        raycaster="objects: .interactivo"

    >



        <!-- ================================================== -->
        <!-- ARCHIVOS -->
        <!-- ================================================== -->

        <a-assets timeout="30000">

            <a-asset-item
                id="Muzilli"
                src="et20optimizada.glb">
            </a-asset-item>

        </a-assets>



        <!-- ================================================== -->
        <!-- CAMARA 3D -->
        <!-- ================================================== -->

        <a-entity

            id="camara-ar"

            camera

            position="0 1.6 0"

            look-controls="
                magicWindowTrackingEnabled: true;
                touchEnabled: true;
            "

        >
        </a-entity>



        <!-- ================================================== -->
        <!-- COLEGIO -->
        <!-- APARECE DIRECTAMENTE -->
        <!-- ================================================== -->

        <a-entity

            id="contenedor-Muzilli"

            position="0 1.25 -4"

            rotation="0 0 0"

        >


            <!-- MODELO 3D -->

            <a-entity

                id="modelo-colegio"

                gltf-model="#Muzilli"

                scale="0.005 0.005 0.005"

                rotation="0 0 0"

            >
            </a-entity>



            <!-- ================================================== -->
            <!-- PUNTO INTERACTIVO 1 -->
            <!-- ================================================== -->

            <a-sphere

                class="interactivo"

                id="btn-edicion"

                position="-1 1 -1"

                radius="0.2"

                color="#33CCFF"

                animation="
                    property: scale;
                    to: 1.2 1.2 1.2;
                    dir: alternate;
                    dur: 800;
                    loop: true;
                "

            >
            </a-sphere>



            <!-- ================================================== -->
            <!-- PUNTO INTERACTIVO 2 -->
            <!-- ================================================== -->

            <a-box

                class="interactivo"

                id="btn-web"

                position="0 2 0"

                depth="0.3"

                height="0.3"

                width="0.3"

                color="#FFCC00"

                animation="
                    property: rotation;
                    to: 0 360 0;
                    dur: 3000;
                    loop: true;
                    easing: linear;
                "

            >
            </a-box>


        </a-entity>


    </a-scene>



    <!-- ====================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ====================================================== -->

    <script>

        const video =
            document.getElementById("video-background");

        const statusText =
            document.getElementById("status");

        const modelo =
            document.getElementById("modelo-colegio");


        const panelInfo =
            document.getElementById("panel-info");

        const infoTitulo =
            document.getElementById("info-titulo");

        const infoTexto =
            document.getElementById("info-texto");

        const panelBotones =
            document.getElementById("panel-botones");



        // =====================================================
        // CAMARA DEL CELULAR
        // =====================================================

        async function iniciarCamara() {

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            facingMode: {
                                ideal: "environment"
                            }

                        },

                        audio: false

                    });


                video.srcObject = stream;


                await video.play();


                console.log("Cámara iniciada correctamente");


            } catch (error) {

                console.error(
                    "Error accediendo a la cámara:",
                    error
                );


                statusText.innerHTML =
                    "⚠ No se pudo abrir la cámara.<br>" +
                    "El modelo igualmente debería aparecer.";

            }

        }



        // =====================================================
        // MODELO CARGADO
        // =====================================================

        modelo.addEventListener(
            "model-loaded",
            function () {

                console.log(
                    "GLB cargado correctamente"
                );


                statusText.innerHTML =
                    "✅ Colegio cargado correctamente";


                statusText.style.color =
                    "#7CFF7C";


                // Ocultar mensaje después de 3 segundos

                setTimeout(() => {

                    document.getElementById(
                        "ui-container"
                    ).style.display = "none";

                }, 3000);

            }
        );



        // =====================================================
        // ERROR CARGANDO MODELO
        // =====================================================

        modelo.addEventListener(
            "model-error",
            function (event) {

                console.error(
                    "ERROR cargando GLB:",
                    event.detail
                );


                statusText.innerHTML =
                    "❌ ERROR cargando et20optimizada.glb";


                statusText.style.color =
                    "#FF5555";

            }
        );



        // =====================================================
        // PUNTO: EDICION
        // =====================================================

        document
            .getElementById("btn-edicion")
            .addEventListener(
                "click",
                function () {

                    infoTitulo.innerText =
                        "Edición y Postproducción";


                    infoTexto.innerText =
                        "Acá utilizamos Premiere y CapCut para montar nuestros proyectos audiovisuales, agregar efectos y color.";


                    panelBotones.innerHTML = `

                        <button

                            onclick="
                                document
                                .getElementById('panel-info')
                                .style.display='none'
                            "

                            style="
                                background:#333;
                                color:white;
                                border:none;
                                padding:10px 20px;
                                border-radius:8px;
                                font-weight:bold;
                            "

                        >

                            Cerrar

                        </button>

                    `;


                    panelInfo.style.display =
                        "block";

                }
            );



        // =====================================================
        // PUNTO: WEB
        // =====================================================

        document
            .getElementById("btn-web")
            .addEventListener(
                "click",
                function () {

                    infoTitulo.innerText =
                        "Página Oficial";


                    infoTexto.innerText =
                        "Conocé más sobre las especialidades del colegio en nuestra web.";


                    panelBotones.innerHTML = `

                        <button

                            onclick="
                                window.location.href =
                                'https://buenosaires.gob.ar/educacion/escuelas'
                            "

                            style="
                                background:#007BFF;
                                color:white;
                                border:none;
                                padding:10px 20px;
                                border-radius:8px;
                                font-weight:bold;
                                margin-right:10px;
                            "

                        >

                            Ir a la Web

                        </button>


                        <button

                            onclick="
                                document
                                .getElementById('panel-info')
                                .style.display='none'
                            "

                            style="
                                background:#ccc;
                                color:#333;
                                border:none;
                                padding:10px 20px;
                                border-radius:8px;
                                font-weight:bold;
                            "

                        >

                            Cancelar

                        </button>

                    `;


                    panelInfo.style.display =
                        "block";

                }
            );



        // =====================================================
        // INICIO
        // =====================================================

        iniciarCamara();

    </script>


</body>
</html>
