<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>AR Muzilli - Técnica N°20</title>

  <!-- A-Frame actual con soporte WebXR -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Cámara usada SOLAMENTE para detectar el rojo antes de entrar a WebXR. */
    #scanner-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      background: #000;
    }

    #scanner-canvas {
      display: none;
    }

    /* El canvas de A-Frame queda transparente durante el pre-scan. */
    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
      background: transparent !important;
    }

    /* Overlay HTML que también se solicita como DOM Overlay en WebXR. */
    #xr-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    #top-panel {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 470px);
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.74);
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 1.35;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    #status {
      font-weight: 700;
    }

    #compat {
      margin-top: 5px;
      opacity: 0.78;
      font-size: 12px;
    }

    #scan-guide {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(66vw, 330px);
      aspect-ratio: 1.6 / 1;
      transform: translate(-50%, -50%);
      border: 3px solid rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      box-sizing: border-box;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    #scan-guide::after {
      content: "Poné el dorso rojo de la tarjeta dentro del recuadro";
      position: absolute;
      left: 50%;
      top: calc(100% + 14px);
      transform: translateX(-50%);
      width: 92vw;
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 6px #000;
    }

    #xr-controls {
      display: none;
      position: absolute;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      gap: 10px;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    #xr-controls button {
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 14px;
      background: rgba(20, 20, 20, 0.82);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #btn-reubicar {
      display: none;
    }

    #btn-salir {
      display: none;
    }

    #fallback-reload {
      display: none;
      position: absolute;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      pointer-events: auto;
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 700;
      background: #fff;
      color: #111;
    }

    /* Mientras el DOM Overlay está activo en WebXR. */
    #xr-overlay:xr-overlay #xr-controls {
      display: flex;
    }

    /* Deja el botón nativo de A-Frame por arriba de la UI. */
    .a-enter-ar {
      z-index: 200 !important;
    }
  </style>

  <script>
    /*
      Componente 1:
      Alinea automáticamente la parte más baja del GLB con Y = 0.
      Esto ayuda a que, al colocarlo sobre el hit-test del piso, no quede
      enterrado o flotando por culpa del origen del archivo 3D.
    */
    AFRAME.registerComponent('floor-align', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const object = this.el.getObject3D('mesh');
          if (!object) return;

          object.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(object);
          if (!Number.isFinite(box.min.y)) return;

          /*
            Como el padre está en el origen cuando se carga el modelo,
            box.min.y representa cuánto sobresale hacia abajo.
          */
          this.el.object3D.position.y -= box.min.y;
          this.el.object3D.updateMatrixWorld(true);

          console.log('[GLB] Alineado al piso. minY:', box.min.y);
        });
      }
    });

    /*
      Componente 2:
      WebXR Hit Test.

      - Busca una superficie real.
      - Muestra un retículo.
      - Al tocar la pantalla, copia esa pose al contenedor del colegio.
      - Después NO vuelve a modificar su posición.
      - El seguimiento espacial de WebXR/ARCore hace que puedas caminar
        alrededor del colegio y que permanezca en el mismo lugar físico.
    */
    AFRAME.registerComponent('ar-floor-placement', {
      schema: {
        target: { type: 'selector' },
        model: { type: 'selector' },
        reticle: { type: 'selector' },
        status: { type: 'selector' },
        repositionButton: { type: 'selector' },
        exitButton: { type: 'selector' }
      },

      init: function () {
        this.hitTestSource = null;
        this.viewerSpace = null;
        this.session = null;
        this.placed = false;
        this.modelReady = false;
        this.hasHit = false;

        this.onEnterXR = this.onEnterXR.bind(this);
        this.onExitXR = this.onExitXR.bind(this);
        this.onSelect = this.onSelect.bind(this);
        this.resetPlacement = this.resetPlacement.bind(this);

        if (this.data.reticle) {
          this.data.reticle.object3D.visible = false;
        }

        if (this.data.target) {
          this.data.target.object3D.visible = false;
        }

        if (this.data.model) {
          this.data.model.addEventListener('model-loaded', () => {
            this.modelReady = true;
            console.log('[GLB] Modelo cargado.');
          });

          this.data.model.addEventListener('model-error', (event) => {
            console.error('[GLB] Error:', event.detail);
            this.setStatus('Error cargando et20optimizada.glb.');
          });
        }

        this.el.sceneEl.addEventListener('enter-vr', this.onEnterXR);
        this.el.sceneEl.addEventListener('exit-vr', this.onExitXR);

        if (this.data.repositionButton) {
          this.data.repositionButton.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            this.resetPlacement();
          });

          /*
            Evita que un toque sobre el botón también sea interpretado
            como un "select" para colocar el modelo.
          */
          this.data.repositionButton.addEventListener('beforexrselect', (event) => {
            event.preventDefault();
          });
        }

        if (this.data.exitButton) {
          this.data.exitButton.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();

            const session = this.el.sceneEl.renderer.xr.getSession();
            if (session) session.end();
          });

          this.data.exitButton.addEventListener('beforexrselect', (event) => {
            event.preventDefault();
          });
        }
      },

      setStatus: function (text) {
        if (this.data.status) {
          this.data.status.textContent = text;
        }
      },

      onEnterXR: async function () {
        const scene = this.el.sceneEl;

        /*
          A-Frame usa el evento enter-vr también al entrar en AR.
          Nos aseguramos de ejecutar el hit-test solamente en ar-mode.
        */
        if (!scene.is('ar-mode')) return;

        const session = scene.renderer.xr.getSession();
        if (!session) {
          this.setStatus('No se pudo obtener la sesión WebXR.');
          return;
        }

        this.session = session;
        this.placed = false;
        this.hasHit = false;

        if (this.data.target) {
          this.data.target.object3D.visible = false;
        }

        if (this.data.reticle) {
          this.data.reticle.object3D.visible = false;
        }

        if (this.data.repositionButton) {
          this.data.repositionButton.style.display = 'none';
        }

        if (this.data.exitButton) {
          this.data.exitButton.style.display = 'inline-block';
        }

        this.setStatus('AR iniciada. Mové el teléfono lentamente y apuntá al piso.');

        try {
          this.viewerSpace = await session.requestReferenceSpace('viewer');

          this.hitTestSource = await session.requestHitTestSource({
            space: this.viewerSpace
          });

          session.addEventListener('select', this.onSelect);

          session.addEventListener('end', () => {
            if (this.hitTestSource) {
              try {
                this.hitTestSource.cancel();
              } catch (_) {}
            }

            this.hitTestSource = null;
            this.viewerSpace = null;
            this.session = null;
          }, { once: true });

          console.log('[WebXR] Hit-test listo.');
        } catch (error) {
          console.error('[WebXR] No se pudo iniciar hit-test:', error);
          this.setStatus('WebXR abrió, pero el Hit Test no está disponible.');
        }
      },

      onExitXR: function () {
        if (this.data.reticle) {
          this.data.reticle.object3D.visible = false;
        }

        if (this.data.exitButton) {
          this.data.exitButton.style.display = 'none';
        }

        if (this.data.repositionButton) {
          this.data.repositionButton.style.display = 'none';
        }

        this.setStatus('Sesión AR finalizada. Recargá la página para comenzar de nuevo.');

        const reload = document.getElementById('fallback-reload');
        if (reload) reload.style.display = 'block';
      },

      onSelect: function () {
        if (this.placed) return;

        if (!this.hasHit || !this.data.reticle || !this.data.reticle.object3D.visible) {
          this.setStatus('Todavía no encuentro el piso. Mové el teléfono lentamente.');
          return;
        }

        if (!this.modelReady) {
          this.setStatus('El piso está listo, pero el colegio todavía está cargando...');
          return;
        }

        const targetObject = this.data.target.object3D;
        const reticleObject = this.data.reticle.object3D;

        /*
          Copiamos posición y orientación detectadas por WebXR.
          A partir de acá el target queda en coordenadas del mundo XR.
        */
        targetObject.position.copy(reticleObject.position);
        targetObject.quaternion.copy(reticleObject.quaternion);
        targetObject.scale.set(1, 1, 1);
        targetObject.visible = true;

        this.placed = true;
        reticleObject.visible = false;

        if (this.data.repositionButton) {
          this.data.repositionButton.style.display = 'inline-block';
        }

        this.setStatus('Colegio fijado. Ya podés sacar la tarjeta y caminar alrededor.');
        console.log('[WebXR] Colegio colocado en el piso.');
      },

      resetPlacement: function () {
        this.placed = false;

        if (this.data.target) {
          this.data.target.object3D.visible = false;
        }

        if (this.data.reticle) {
          this.data.reticle.object3D.visible = false;
        }

        if (this.data.repositionButton) {
          this.data.repositionButton.style.display = 'none';
        }

        this.setStatus('Reubicación activa. Apuntá otra vez al piso y tocá para colocar.');
      },

      tick: function () {
        if (this.placed || !this.hitTestSource) return;

        const renderer = this.el.sceneEl.renderer;
        const frame = renderer.xr.getFrame();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!frame || !referenceSpace) return;

        const results = frame.getHitTestResults(this.hitTestSource);

        if (!results.length) {
          this.hasHit = false;

          if (this.data.reticle) {
            this.data.reticle.object3D.visible = false;
          }

          return;
        }

        const pose = results[0].getPose(referenceSpace);
        if (!pose) return;

        const matrix = new THREE.Matrix4().fromArray(pose.transform.matrix);

        const reticleObject = this.data.reticle.object3D;

        matrix.decompose(
          reticleObject.position,
          reticleObject.quaternion,
          reticleObject.scale
        );

        reticleObject.visible = true;
        this.hasHit = true;

        if (!this.placed) {
          this.setStatus('Piso detectado. Tocá la pantalla para colocar el colegio.');
        }
      },

      remove: function () {
        this.el.sceneEl.removeEventListener('enter-vr', this.onEnterXR);
        this.el.sceneEl.removeEventListener('exit-vr', this.onExitXR);

        if (this.session) {
          this.session.removeEventListener('select', this.onSelect);
        }

        if (this.hitTestSource) {
          try {
            this.hitTestSource.cancel();
          } catch (_) {}
        }
      }
    });
  </script>
</head>

<body>
  <!-- Cámara previa para Tracking HSV. WebXR luego usa su propia cámara. -->
  <video id="scanner-video" autoplay playsinline muted></video>
  <canvas id="scanner-canvas" width="160" height="120"></canvas>

  <!-- Este DIV se usa también como DOM Overlay dentro de WebXR. -->
  <div id="xr-overlay">
    <div id="top-panel">
      <div id="status">Preparando cámara para escanear la tarjeta roja...</div>
      <div id="compat">Comprobando compatibilidad WebXR...</div>
    </div>

    <div id="scan-guide"></div>

    <div id="xr-controls">
      <button id="btn-reubicar">Reubicar colegio</button>
      <button id="btn-salir">Salir de AR</button>
    </div>

    <button id="fallback-reload" onclick="location.reload()">
      Empezar de nuevo
    </button>
  </div>

  <a-scene
    id="scene"
    renderer="alpha: true; antialias: true; colorManagement: true"
    background="transparent: true"

    webxr="
      requiredFeatures: hit-test;
      optionalFeatures: dom-overlay;
      referenceSpaceType: local;
      overlayElement: #xr-overlay;
    "

    xr-mode-ui="XRMode: ar"

    ar-floor-placement="
      target: #colegio-root;
      model: #colegio-model;
      reticle: #reticle;
      status: #status;
      repositionButton: #btn-reubicar;
      exitButton: #btn-salir;
    "
  >
    <a-assets timeout="60000">
      <a-asset-item
        id="Muzilli"
        src="et20optimizada.glb">
      </a-asset-item>
    </a-assets>

    <!--
      Retículo del Hit Test.
      Solo aparece cuando WebXR encuentra una superficie real.
    -->
    <a-ring
      id="reticle"
      radius-inner="0.075"
      radius-outer="0.105"
      rotation="-90 0 0"
      material="color: #ffffff; shader: flat; opacity: 0.9; transparent: true"
      visible="false">
    </a-ring>

    <!--
      Este contenedor se posiciona UNA sola vez en la pose real del piso.
      Después WebXR mantiene la relación espacial mientras caminás.
    -->
    <a-entity
      id="colegio-root"
      visible="false">

      <a-entity
        id="colegio-model"
        gltf-model="#Muzilli"
        scale="0.005 0.005 0.005"
        rotation="0 0 0"
        floor-align>
      </a-entity>
    </a-entity>

    <!-- Cámara que WebXR reemplaza/actualiza con tracking 6DoF. -->
    <a-camera position="0 0 0"></a-camera>
  </a-scene>

  <script>
    const video = document.getElementById('scanner-video');
    const canvas = document.getElementById('scanner-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const statusText = document.getElementById('status');
    const compatText = document.getElementById('compat');
    const scanGuide = document.getElementById('scan-guide');

    /*
      Parámetros HSV.
      El rojo está alrededor de H = 0° / 360°.
    */
    const TARGET_HUE = 0;
    const HUE_TOLERANCE = 20;
    const MIN_SATURATION = 50;
    const MIN_VALUE = 25;

    /*
      Para evitar que cualquier objeto rojo active el sistema:
      - analizamos solo el centro;
      - exigimos 22% de rojo;
      - durante 10 frames consecutivos.
    */
    const REQUIRED_RED_RATIO = 0.22;
    const REQUIRED_CONSECUTIVE_FRAMES = 10;

    let consecutiveFrames = 0;
    let unlocked = false;
    let scannerStream = null;
    let xrSupported = false;

    /*
      A-Frame crea el botón de entrada a AR dinámicamente.
      Antes de detectar rojo lo hacemos invisible, pero NO cambiamos display:
      así, si WebXR no está soportado, A-Frame puede seguir ocultándolo.
    */
    function updateNativeARButton() {
      const enterAR = document.querySelector('.a-enter-ar');

      if (!enterAR) return;

      if (unlocked && xrSupported) {
        enterAR.style.visibility = '';
        enterAR.style.pointerEvents = '';
        enterAR.style.opacity = '';
      } else {
        enterAR.style.visibility = 'hidden';
        enterAR.style.pointerEvents = 'none';
        enterAR.style.opacity = '0';
      }
    }

    const arButtonObserver = new MutationObserver(updateNativeARButton);
    arButtonObserver.observe(document.documentElement, {
      childList: true,
      subtree: true
    });

    async function checkWebXR() {
      if (!navigator.xr) {
        xrSupported = false;
        compatText.textContent =
          'WebXR immersive-ar no está disponible en este navegador/dispositivo.';
        updateNativeARButton();
        return;
      }

      try {
        xrSupported = await navigator.xr.isSessionSupported('immersive-ar');

        compatText.textContent = xrSupported
          ? 'WebXR AR disponible.'
          : 'Este dispositivo no ofrece WebXR immersive-ar.';

        updateNativeARButton();
      } catch (error) {
        console.error('[WebXR] Error comprobando soporte:', error);
        xrSupported = false;
        compatText.textContent = 'No se pudo comprobar compatibilidad WebXR.';
        updateNativeARButton();
      }
    }

    async function startScannerCamera() {
      try {
        scannerStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = scannerStream;
        await video.play();

        statusText.textContent = 'Enfocá el dorso rojo de la tarjeta.';
        requestAnimationFrame(processFrame);
      } catch (error) {
        console.error('[CAM] Error:', error);
        statusText.textContent =
          'No pude abrir la cámara. Revisá el permiso de cámara del navegador.';
      }
    }

    function stopScannerCamera() {
      if (scannerStream) {
        scannerStream.getTracks().forEach(track => track.stop());
        scannerStream = null;
      }

      video.pause();
      video.srcObject = null;
      video.style.display = 'none';
    }

    function rgbToHsv(r, g, b) {
      r /= 255;
      g /= 255;
      b /= 255;

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const delta = max - min;

      let h = 0;
      const s = max === 0 ? 0 : delta / max;
      const v = max;

      if (delta !== 0) {
        switch (max) {
          case r:
            h = ((g - b) / delta) % 6;
            break;
          case g:
            h = (b - r) / delta + 2;
            break;
          case b:
            h = (r - g) / delta + 4;
            break;
        }

        h *= 60;
        if (h < 0) h += 360;
      }

      return [h, s * 100, v * 100];
    }

    function hueDistance(a, b) {
      const diff = Math.abs(a - b);
      return Math.min(diff, 360 - diff);
    }

    function processFrame() {
      if (unlocked) return;

      if (video.readyState >= video.HAVE_CURRENT_DATA) {
        const width = canvas.width;
        const height = canvas.height;

        ctx.drawImage(video, 0, 0, width, height);

        const frame = ctx.getImageData(0, 0, width, height);
        const data = frame.data;

        /*
          Región central aproximada al recuadro visual.
        */
        const x1 = Math.floor(width * 0.28);
        const x2 = Math.floor(width * 0.72);
        const y1 = Math.floor(height * 0.30);
        const y2 = Math.floor(height * 0.70);

        let redPixels = 0;
        let sampledPixels = 0;

        for (let y = y1; y < y2; y += 2) {
          for (let x = x1; x < x2; x += 2) {
            const index = (y * width + x) * 4;

            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];

            const [h, s, v] = rgbToHsv(r, g, b);

            sampledPixels++;

            if (
              hueDistance(h, TARGET_HUE) <= HUE_TOLERANCE &&
              s >= MIN_SATURATION &&
              v >= MIN_VALUE
            ) {
              redPixels++;
            }
          }
        }

        const ratio = sampledPixels
          ? redPixels / sampledPixels
          : 0;

        const percentage = Math.round(ratio * 100);

        statusText.textContent =
          `Escaneando rojo... ${percentage}% detectado`;

        if (ratio >= REQUIRED_RED_RATIO) {
          consecutiveFrames++;
        } else {
          consecutiveFrames = 0;
        }

        if (consecutiveFrames >= REQUIRED_CONSECUTIVE_FRAMES) {
          unlockAR();
          return;
        }
      }

      requestAnimationFrame(processFrame);
    }

    function unlockAR() {
      if (unlocked) return;

      unlocked = true;

      /*
        El HSV ya cumplió su única función: desbloquear.
        Liberamos la cámara HTML antes de que WebXR/ARCore la tome.
      */
      stopScannerCamera();

      scanGuide.style.display = 'none';

      if (xrSupported) {
        statusText.textContent =
          'Tarjeta detectada. Tocá el botón AR de abajo para entrar y buscar el piso.';
      } else {
        statusText.textContent =
          'Tarjeta detectada, pero este dispositivo no soporta WebXR immersive-ar.';
      }

      updateNativeARButton();

      console.log('[HSV] Rojo confirmado. Scanner detenido.');
    }

    document.getElementById('fallback-reload').addEventListener(
      'beforexrselect',
      event => event.preventDefault()
    );

    checkWebXR();
    startScannerCamera();
    updateNativeARButton();
  </script>
</body>
</html>
