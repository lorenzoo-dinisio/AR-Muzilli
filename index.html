<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Muzilli - Técnica N°20</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #video-background {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    #hiddenCanvas {
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
    }

    #scan-box {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(62vw, 320px);
      aspect-ratio: 1.6 / 1;
      transform: translate(-50%, -50%);
      border: 3px solid rgba(255,255,255,.95);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.18);
      z-index: 20;
      pointer-events: none;
    }

    #scan-box::after {
      content: "Poné el dorso rojo de la tarjeta dentro del recuadro";
      position: absolute;
      left: 50%;
      top: calc(100% + 14px);
      transform: translateX(-50%);
      width: 90vw;
      text-align: center;
      color: #fff;
      font-size: 14px;
      text-shadow: 0 2px 5px rgba(0,0,0,.8);
    }

    #ui-container {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(88vw, 430px);
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,.72);
      color: white;
      text-align: center;
      z-index: 30;
      font-size: 14px;
    }

    #btn-reiniciar {
      display: none;
      margin-top: 10px;
      padding: 9px 14px;
      border: 0;
      border-radius: 8px;
      background: #ff3366;
      color: #fff;
      font-weight: 700;
    }

    #panel-info {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: min(82vw, 350px);
      padding: 20px;
      border-radius: 15px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 5px 18px rgba(0,0,0,.35);
      text-align: center;
      z-index: 40;
    }
  </style>
</head>

<body>

  <video id="video-background" autoplay playsinline muted></video>
  <canvas id="hiddenCanvas" width="160" height="120"></canvas>

  <div id="scan-box"></div>

  <div id="ui-container">
    <div id="status">Enfocá el dorso rojo de la tarjeta...</div>
    <button id="btn-reiniciar">Volver a escanear</button>
  </div>

  <div id="panel-info">
    <h2 id="info-titulo" style="margin:0 0 10px;color:#333">Título</h2>
    <p id="info-texto" style="margin:0 0 15px;color:#555;line-height:1.4">Texto</p>
    <div id="panel-botones"></div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    color-space="sRGB"
    renderer="alpha: true; antialias: true"
    background="transparent: true"
    cursor="rayOrigin: mouse"
    raycaster="objects: .interactivo">

    <a-assets timeout="30000">
      <a-asset-item id="Muzilli" src="et20optimizada.glb"></a-asset-item>
    </a-assets>

    <!-- Altura aproximada de los ojos -->
    <a-entity
      id="camara-ar"
      camera
      position="0 1.6 0"
      look-controls="magicWindowTrackingEnabled: true; touchEnabled: true">
    </a-entity>

    <!--
      El contenedor NO está pegado a la cámara.
      Está en coordenadas del mundo A-Frame.
      Y=0 se usa como "piso virtual".
    -->
    <a-entity
      id="contenedor-Muzilli"
      position="0 0 -3"
      visible="false">

      <!-- Sin rotación automática: si queremos que quede fijo, no debe girar solo -->
      <a-entity
        id="modelo-colegio"
        gltf-model="#Muzilli"
        scale="0.005 0.005 0.005">
      </a-entity>

      <a-sphere
        class="interactivo"
        id="btn-edicion"
        position="-1 1.2 -1"
        radius="0.20"
        color="#33CCFF"
        animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; dur: 800; loop: true">
      </a-sphere>

      <a-box
        class="interactivo"
        id="btn-web"
        position="0 2 0"
        depth="0.3"
        height="0.3"
        width="0.3"
        color="#FFCC00"
        animation="property: rotation; to: 0 360 0; dur: 3000; loop: true; easing: linear">
      </a-box>

    </a-entity>
  </a-scene>

  <script>
    const video = document.getElementById('video-background');
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const maqueta = document.getElementById('contenedor-Muzilli');
    const modelo = document.getElementById('modelo-colegio');

    const statusText = document.getElementById('status');
    const scanBox = document.getElementById('scan-box');
    const btnReiniciar = document.getElementById('btn-reiniciar');

    const panelInfo = document.getElementById('panel-info');
    const infoTitulo = document.getElementById('info-titulo');
    const infoTexto = document.getElementById('info-texto');
    const panelBotones = document.getElementById('panel-botones');

    // -------------------------------
    // CONFIGURACION DEL TRACKING HSV
    // -------------------------------
    const TARGET_HUE = 0;          // rojo
    const HUE_TOLERANCE = 20;
    const MIN_SATURATION = 50;
    const MIN_VALUE = 25;

    // El rojo debe ocupar al menos 18% de la zona central.
    const REQUIRED_RED_RATIO = 0.18;

    // Debe cumplirse durante varios frames seguidos para evitar falsos positivos.
    const REQUIRED_CONSECUTIVE_FRAMES = 8;

    let consecutiveFrames = 0;
    let modeloFijado = false;
    let modeloCargado = false;

    modelo.addEventListener('model-loaded', () => {
      modeloCargado = true;
      console.log('GLB cargado correctamente.');
    });

    modelo.addEventListener('model-error', (event) => {
      console.error('Error cargando el GLB:', event.detail);
      statusText.textContent = 'Error cargando et20optimizada.glb';
      statusText.style.color = '#ff6b6b';
    });

    // -------------------------------
    // INTERACCIONES
    // -------------------------------
    document.getElementById('btn-edicion').addEventListener('click', () => {
      infoTitulo.innerText = 'Edición y Postproducción';
      infoTexto.innerText = 'Acá utilizamos Premiere y CapCut para montar nuestros proyectos audiovisuales, agregar efectos y color.';
      panelBotones.innerHTML =
        '<button onclick="document.getElementById(\'panel-info\').style.display=\'none\'" ' +
        'style="background:#333;color:white;border:0;padding:10px 20px;border-radius:8px;font-weight:bold">' +
        'Cerrar</button>';

      panelInfo.style.display = 'block';
    });

    document.getElementById('btn-web').addEventListener('click', () => {
      infoTitulo.innerText = 'Página Oficial';
      infoTexto.innerText = 'Conocé más sobre las especialidades del colegio en nuestra web.';

      panelBotones.innerHTML = `
        <button
          onclick="window.location.href='https://buenosaires.gob.ar/educacion/escuelas'"
          style="background:#007BFF;color:white;border:0;padding:10px 20px;border-radius:8px;font-weight:bold;margin-right:8px">
          Ir a la Web
        </button>
        <button
          onclick="document.getElementById('panel-info').style.display='none'"
          style="background:#ccc;color:#333;border:0;padding:10px 20px;border-radius:8px;font-weight:bold">
          Cancelar
        </button>
      `;

      panelInfo.style.display = 'block';
    });

    btnReiniciar.addEventListener('click', () => {
      modeloFijado = false;
      consecutiveFrames = 0;

      maqueta.setAttribute('visible', false);

      scanBox.style.display = 'block';
      btnReiniciar.style.display = 'none';

      statusText.textContent = 'Enfocá el dorso rojo de la tarjeta...';
      statusText.style.color = 'white';

      requestAnimationFrame(procesarFrame);
    });

    // -------------------------------
    // CAMARA
    // -------------------------------
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' }
      },
      audio: false
    })
    .then(stream => {
      video.srcObject = stream;
      return video.play();
    })
    .then(() => {
      requestAnimationFrame(procesarFrame);
    })
    .catch(err => {
      console.error('Error accediendo a la cámara:', err);
      statusText.textContent = 'Error de cámara. Verificá los permisos.';
      statusText.style.color = '#ff6b6b';
    });

    // -------------------------------
    // RGB -> HSV
    // -------------------------------
    function rgbToHsv(r, g, b) {
      r /= 255;
      g /= 255;
      b /= 255;

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const d = max - min;

      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (d !== 0) {
        switch (max) {
          case r:
            h = ((g - b) / d) % 6;
            break;
          case g:
            h = (b - r) / d + 2;
            break;
          case b:
            h = (r - g) / d + 4;
            break;
        }

        h *= 60;
        if (h < 0) h += 360;
      }

      return [h, s * 100, v * 100];
    }

    function hueDistance(a, b) {
      const diff = Math.abs(a - b);
      return Math.min(diff, 360 - diff);
    }

    // -------------------------------
    // DETECTOR DE ROJO
    // -------------------------------
    function procesarFrame() {
      // Una vez desbloqueado, NO seguimos escaneando HSV.
      // La cámara sigue abierta como fondo, pero el detector deja de consumir CPU.
      if (modeloFijado) return;

      if (video.readyState >= video.HAVE_CURRENT_DATA) {
        // Procesamos una imagen chica para ahorrar batería.
        const w = canvas.width;
        const h = canvas.height;

        ctx.drawImage(video, 0, 0, w, h);

        const frame = ctx.getImageData(0, 0, w, h);
        const data = frame.data;

        // Solo analizamos el rectángulo central.
        // Así no desbloquea porque haya un objeto rojo en cualquier rincón.
        const roiX1 = Math.floor(w * 0.30);
        const roiX2 = Math.floor(w * 0.70);
        const roiY1 = Math.floor(h * 0.30);
        const roiY2 = Math.floor(h * 0.70);

        let redPixels = 0;
        let sampledPixels = 0;

        // Saltamos de a 2 píxeles para que sea más liviano.
        for (let y = roiY1; y < roiY2; y += 2) {
          for (let x = roiX1; x < roiX2; x += 2) {
            const i = (y * w + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const [hue, saturation, value] = rgbToHsv(r, g, b);

            sampledPixels++;

            if (
              hueDistance(hue, TARGET_HUE) <= HUE_TOLERANCE &&
              saturation >= MIN_SATURATION &&
              value >= MIN_VALUE
            ) {
              redPixels++;
            }
          }
        }

        const redRatio = sampledPixels > 0
          ? redPixels / sampledPixels
          : 0;

        const porcentaje = Math.round(redRatio * 100);

        statusText.textContent =
          `Buscando tarjeta roja... ${porcentaje}% rojo detectado`;

        if (redRatio >= REQUIRED_RED_RATIO) {
          consecutiveFrames++;
        } else {
          consecutiveFrames = 0;
        }

        if (consecutiveFrames >= REQUIRED_CONSECUTIVE_FRAMES) {
          desbloquearColegio();
          return;
        }
      }

      requestAnimationFrame(procesarFrame);
    }

    function desbloquearColegio() {
      modeloFijado = true;

      // Se muestra una sola vez y queda visible aunque ya no haya rojo.
      maqueta.setAttribute('visible', true);

      scanBox.style.display = 'none';
      btnReiniciar.style.display = 'inline-block';

      if (modeloCargado) {
        statusText.textContent = 'Colegio desbloqueado y fijado.';
      } else {
        statusText.textContent = 'Color detectado. Terminando de cargar el colegio...';
      }

      statusText.style.color = '#7CFF7C';

      console.log('Tracking HSV detenido. El colegio queda visible.');
    }
  </script>
</body>
</html>
