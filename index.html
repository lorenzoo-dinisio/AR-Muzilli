<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
  >
  <title>AR Muzilli - Técnica N°20</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    #scanner-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      background: #000;
    }

    #scanner-canvas {
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
      background: transparent !important;
    }

    #xr-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    #top-panel {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 470px);
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.74);
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 1.35;
      box-shadow: 0 5px 18px rgba(0,0,0,.25);
    }

    #status {
      font-weight: 700;
    }

    #compat {
      margin-top: 5px;
      opacity: .78;
      font-size: 12px;
    }

    #scan-guide {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(66vw, 330px);
      aspect-ratio: 1.6 / 1;
      transform: translate(-50%, -50%);
      border: 3px solid rgba(255,255,255,.96);
      border-radius: 18px;
      box-sizing: border-box;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.18);
      pointer-events: none;
    }

    #scan-guide::after {
      content: "Poné el dorso rojo de la tarjeta dentro del recuadro";
      position: absolute;
      left: 50%;
      top: calc(100% + 14px);
      transform: translateX(-50%);
      width: 92vw;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 6px #000;
    }

    #btn-entrar-ar {
      display: none;
      position: absolute;
      left: 50%;
      bottom: max(34px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      min-width: 220px;
      padding: 15px 22px;
      border: 0;
      border-radius: 999px;
      background: #ffffff;
      color: #111111;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      pointer-events: auto;
      z-index: 150;
    }

    #btn-entrar-ar:disabled {
      opacity: .65;
    }

    #xr-controls {
      display: none;
      position: absolute;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      gap: 10px;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 160;
    }

    #xr-controls button {
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 14px;
      background: rgba(20,20,20,.82);
      color: #fff;
    }

    #btn-reubicar,
    #btn-salir {
      display: none;
    }

    #fallback-reload {
      display: none;
      position: absolute;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      pointer-events: auto;
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      font-weight: 700;
      background: #fff;
      color: #111;
    }

    #xr-overlay:xr-overlay #xr-controls {
      display: flex;
    }
  </style>

  <script>
    AFRAME.registerComponent('floor-align', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const object = this.el.getObject3D('mesh');
          if (!object) return;

          object.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(object);
          if (!Number.isFinite(box.min.y)) return;

          this.el.object3D.position.y -= box.min.y;
          this.el.object3D.updateMatrixWorld(true);

          console.log('[GLB] Alineado al piso. minY:', box.min.y);
        });
      }
    });

    AFRAME.registerComponent('ar-floor-placement', {
      schema: {
        target: { type: 'selector' },
        model: { type: 'selector' },
        reticle: { type: 'selector' },
        status: { type: 'selector' },
        repositionButton: { type: 'selector' },
        exitButton: { type: 'selector' }
      },

      init: function () {
        this.hitTestSource = null;
        this.viewerSpace = null;
        this.session = null;
        this.placed = false;
        this.modelReady = false;
        this.hasHit = false;

        this.onEnterXR = this.onEnterXR.bind(this);
        this.onExitXR = this.onExitXR.bind(this);
        this.onSelect = this.onSelect.bind(this);
        this.resetPlacement = this.resetPlacement.bind(this);

        if (this.data.reticle) {
          this.data.reticle.object3D.visible = false;
        }

        if (this.data.target) {
          this.data.target.object3D.visible = false;
        }

        if (this.data.model) {
          this.data.model.addEventListener('model-loaded', () => {
            this.modelReady = true;
            console.log('[GLB] Modelo cargado.');
          });

          this.data.model.addEventListener('model-error', (event) => {
            console.error('[GLB] Error:', event.detail);
            this.setStatus('Error cargando et20optimizada.glb.');
          });
        }

        this.el.sceneEl.addEventListener('enter-vr', this.onEnterXR);
        this.el.sceneEl.addEventListener('exit-vr', this.onExitXR);

        if (this.data.repositionButton) {
          this.data.repositionButton.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            this.resetPlacement();
          });

          this.data.repositionButton.addEventListener('beforexrselect', (event) => {
            event.preventDefault();
          });
        }

        if (this.data.exitButton) {
          this.data.exitButton.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();

            const session = this.el.sceneEl.renderer.xr.getSession();
            if (session) session.end();
          });

          this.data.exitButton.addEventListener('beforexrselect', (event) => {
            event.preventDefault();
          });
        }
      },

      setStatus: function (text) {
        if (this.data.status) {
          this.data.status.textContent = text;
        }
      },

      onEnterXR: async function () {
        const scene = this.el.sceneEl;

        if (!scene.is('ar-mode')) return;

        document.getElementById('scanner-video').style.display = 'none';
        document.getElementById('btn-entrar-ar').style.display = 'none';

        const session = scene.renderer.xr.getSession();

        if (!session) {
          this.setStatus('No se pudo obtener la sesión WebXR.');
          return;
        }

        this.session = session;
        this.placed = false;
        this.hasHit = false;

        if (this.data.target) {
          this.data.target.object3D.visible = false;
        }

        if (this.data.reticle) {
          this.data.reticle.object3D.visible = false;
        }

        if (this.data.repositionButton) {
          this.data.repositionButton.style.display = 'none';
        }

        if (this.data.exitButton) {
          this.data.exitButton.style.display = 'inline-block';
        }

        this.setStatus('AR iniciada. Mové el teléfono lentamente y apuntá al piso.');

        try {
          this.viewerSpace = await session.requestReferenceSpace('viewer');

          this.hitTestSource = await session.requestHitTestSource({
            space: this.viewerSpace
          });

          session.addEventListener('select', this.onSelect);

          session.addEventListener('end', () => {
            if (this.hitTestSource) {
              try {
                this.hitTestSource.cancel();
              } catch (_) {}
            }

            this.hitTestSource = null;
            this.viewerSpace = null;
            this.session = null;
          }, { once: true });

          console.log('[WebXR] Hit-test listo.');
        } catch (error) {
          console.error('[WebXR] No se pudo iniciar hit-test:', error);
          this.setStatus('WebXR abrió, pero el Hit Test no está disponible.');
        }
      },

      onExitXR: function () {
        if (this.data.reticle) {
          this.data.reticle.object3D.visible = false;
        }

        if (this.data.exitButton) {
          this.data.exitButton.style.display = 'none';
        }

        if (this.data.repositionButton) {
          this.data.repositionButton.style.display = 'none';
        }

        this.setStatus('Sesión AR finalizada. Recargá la página para comenzar de nuevo.');

        const reload = document.getElementById('fallback-reload');
        if (reload) reload.style.display = 'block';
      },

      onSelect: function () {
        if (this.placed) return;

        if (!this.hasHit || !this.data.reticle || !this.data.reticle.object3D.visible) {
          this.setStatus('Todavía no encuentro el piso. Mové el teléfono lentamente.');
          return;
        }

        if (!this.modelReady) {
          this.setStatus('El piso está listo, pero el colegio todavía está cargando...');
          return;
        }

        const targetObject = this.data.target.object3D;
        const reticleObject = this.data.reticle.object3D;

        targetObject.position.copy(reticleObject.position);
        targetObject.quaternion.copy(reticleObject.quaternion);
        targetObject.scale.set(1, 1, 1);
        targetObject.visible = true;

        this.placed = true;
        reticleObject.visible = false;

        if (this.data.repositionButton) {
          this.data.repositionButton.style.display = 'inline-block';
        }

        this.setStatus('Colegio fijado. Ya podés caminar alrededor.');
      },

      resetPlacement: function () {
        this.placed = false;

        if (this.data.target) {
          this.data.target.object3D.visible = false;
        }

        if (this.data.reticle) {
          this.data.reticle.object3D.visible = false;
        }

        if (this.data.repositionButton) {
          this.data.repositionButton.style.display = 'none';
        }

        this.setStatus('Reubicación activa. Apuntá al piso y tocá para colocar.');
      },

      tick: function () {
        if (this.placed || !this.hitTestSource) return;

        const scene = this.el.sceneEl;
        const renderer = scene.renderer;

        const frame = scene.frame || renderer.xr.getFrame?.();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!frame || !referenceSpace) return;

        const results = frame.getHitTestResults(this.hitTestSource);

        if (!results.length) {
          this.hasHit = false;

          if (this.data.reticle) {
            this.data.reticle.object3D.visible = false;
          }

          return;
        }

        const pose = results[0].getPose(referenceSpace);
        if (!pose) return;

        const matrix = new THREE.Matrix4().fromArray(pose.transform.matrix);
        const reticleObject = this.data.reticle.object3D;

        matrix.decompose(
          reticleObject.position,
          reticleObject.quaternion,
          reticleObject.scale
        );

        reticleObject.visible = true;
        this.hasHit = true;

        this.setStatus('Piso detectado. Tocá la pantalla para colocar el colegio.');
      }
    });
  </script>
</head>

<body>

  <video id="scanner-video" autoplay playsinline muted></video>
  <canvas id="scanner-canvas" width="160" height="120"></canvas>

  <div id="xr-overlay">

    <div id="top-panel">
      <div id="status">Preparando cámara para escanear la tarjeta roja...</div>
      <div id="compat">Comprobando compatibilidad WebXR...</div>
    </div>

    <div id="scan-guide"></div>

    <!-- ESTE ES EL NUEVO BOTÓN PROPIO, NO DEPENDE DEL BOTÓN DE A-FRAME -->
    <button id="btn-entrar-ar" type="button">
      Entrar en Realidad Aumentada
    </button>

    <div id="xr-controls">
      <button id="btn-reubicar" type="button">Reubicar colegio</button>
      <button id="btn-salir" type="button">Salir de AR</button>
    </div>

    <button id="fallback-reload" type="button" onclick="location.reload()">
      Empezar de nuevo
    </button>

  </div>

  <a-scene
    id="scene"

    renderer="alpha: true; antialias: true; colorManagement: true"

    webxr="
      requiredFeatures: hit-test;
      optionalFeatures: dom-overlay;
      referenceSpaceType: local;
      overlayElement: #xr-overlay;
    "

    xr-mode-ui="enabled: false"

    ar-floor-placement="
      target: #colegio-root;
      model: #colegio-model;
      reticle: #reticle;
      status: #status;
      repositionButton: #btn-reubicar;
      exitButton: #btn-salir;
    "
  >

    <a-assets timeout="60000">
      <a-asset-item
        id="Muzilli"
        src="et20optimizada.glb">
      </a-asset-item>
    </a-assets>

    <a-ring
      id="reticle"
      radius-inner="0.075"
      radius-outer="0.105"
      rotation="-90 0 0"
      material="color: #ffffff; shader: flat; opacity: 0.9; transparent: true"
      visible="false">
    </a-ring>

    <a-entity
      id="colegio-root"
      visible="false">

      <a-entity
        id="colegio-model"
        gltf-model="#Muzilli"
        scale="0.005 0.005 0.005"
        rotation="0 0 0"
        floor-align>
      </a-entity>

    </a-entity>

    <a-camera position="0 0 0"></a-camera>

  </a-scene>

  <script>
    const video = document.getElementById('scanner-video');
    const canvas = document.getElementById('scanner-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const scene = document.getElementById('scene');
    const statusText = document.getElementById('status');
    const compatText = document.getElementById('compat');
    const scanGuide = document.getElementById('scan-guide');
    const btnEntrarAR = document.getElementById('btn-entrar-ar');

    const TARGET_HUE = 0;
    const HUE_TOLERANCE = 20;
    const MIN_SATURATION = 50;
    const MIN_VALUE = 25;

    const REQUIRED_RED_RATIO = 0.22;
    const REQUIRED_CONSECUTIVE_FRAMES = 10;

    let consecutiveFrames = 0;
    let unlocked = false;
    let scannerStream = null;
    let xrSupported = false;
    let enteringAR = false;

    async function checkWebXR() {
      if (!navigator.xr) {
        xrSupported = false;
        compatText.textContent =
          'WebXR immersive-ar no está disponible en este navegador/dispositivo.';
        return;
      }

      try {
        xrSupported = await navigator.xr.isSessionSupported('immersive-ar');

        compatText.textContent = xrSupported
          ? 'WebXR AR disponible.'
          : 'Este dispositivo no ofrece WebXR immersive-ar.';
      } catch (error) {
        console.error('[WebXR] Error comprobando soporte:', error);
        xrSupported = false;
        compatText.textContent = 'No se pudo comprobar compatibilidad WebXR.';
      }
    }

    async function startScannerCamera(processHSV = true) {
      try {
        if (scannerStream) {
          scannerStream.getTracks().forEach(track => track.stop());
        }

        scannerStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.style.display = 'block';
        video.srcObject = scannerStream;
        await video.play();

        if (processHSV && !unlocked) {
          statusText.textContent = 'Enfocá el dorso rojo de la tarjeta.';
          requestAnimationFrame(processFrame);
        }
      } catch (error) {
        console.error('[CAM] Error:', error);
        statusText.textContent =
          'No pude abrir la cámara. Revisá el permiso de cámara.';
      }
    }

    /*
      Cierra la cámara HTML para que WebXR/ARCore pueda usarla.
      NO ocultamos todavía el video: conserva el último frame hasta que
      la sesión AR realmente haya empezado, evitando el "pantallazo negro".
    */
    function releaseScannerCameraForXR() {
      if (scannerStream) {
        scannerStream.getTracks().forEach(track => track.stop());
        scannerStream = null;
      }
    }

    function rgbToHsv(r, g, b) {
      r /= 255;
      g /= 255;
      b /= 255;

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const delta = max - min;

      let h = 0;
      const s = max === 0 ? 0 : delta / max;
      const v = max;

      if (delta !== 0) {
        switch (max) {
          case r:
            h = ((g - b) / delta) % 6;
            break;
          case g:
            h = (b - r) / delta + 2;
            break;
          case b:
            h = (r - g) / delta + 4;
            break;
        }

        h *= 60;
        if (h < 0) h += 360;
      }

      return [h, s * 100, v * 100];
    }

    function hueDistance(a, b) {
      const diff = Math.abs(a - b);
      return Math.min(diff, 360 - diff);
    }

    function processFrame() {
      if (unlocked) return;

      if (video.readyState >= video.HAVE_CURRENT_DATA) {
        const width = canvas.width;
        const height = canvas.height;

        ctx.drawImage(video, 0, 0, width, height);

        const frame = ctx.getImageData(0, 0, width, height);
        const data = frame.data;

        const x1 = Math.floor(width * 0.28);
        const x2 = Math.floor(width * 0.72);
        const y1 = Math.floor(height * 0.30);
        const y2 = Math.floor(height * 0.70);

        let redPixels = 0;
        let sampledPixels = 0;

        for (let y = y1; y < y2; y += 2) {
          for (let x = x1; x < x2; x += 2) {
            const index = (y * width + x) * 4;

            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];

            const [h, s, v] = rgbToHsv(r, g, b);

            sampledPixels++;

            if (
              hueDistance(h, TARGET_HUE) <= HUE_TOLERANCE &&
              s >= MIN_SATURATION &&
              v >= MIN_VALUE
            ) {
              redPixels++;
            }
          }
        }

        const ratio = sampledPixels ? redPixels / sampledPixels : 0;
        const percentage = Math.round(ratio * 100);

        statusText.textContent =
          `Escaneando rojo... ${percentage}% detectado`;

        if (ratio >= REQUIRED_RED_RATIO) {
          consecutiveFrames++;
        } else {
          consecutiveFrames = 0;
        }

        if (consecutiveFrames >= REQUIRED_CONSECUTIVE_FRAMES) {
          unlockAR();
          return;
        }
      }

      requestAnimationFrame(processFrame);
    }

    function unlockAR() {
      if (unlocked) return;

      unlocked = true;

      /*
        IMPORTANTE:
        El detector HSV se detiene, pero NO cerramos la cámara todavía.
        Así la imagen no se vuelve negra mientras esperamos el tap.
      */
      scanGuide.style.display = 'none';

      if (xrSupported) {
        statusText.textContent =
          'Tarjeta detectada. Tocá “Entrar en Realidad Aumentada”.';

        btnEntrarAR.style.display = 'block';
      } else {
        statusText.textContent =
          'Tarjeta detectada, pero este dispositivo/navegador no soporta WebXR immersive-ar.';
      }

      console.log('[HSV] Tarjeta confirmada. Esperando tap para entrar a WebXR.');
    }

    /*
      BOTÓN AR PROPIO.

      La llamada a scene.enterAR() ocurre directamente dentro del evento click,
      por lo que cuenta como una acción explícita del usuario.
    */
    btnEntrarAR.addEventListener('click', function () {
      if (!unlocked || !xrSupported || enteringAR) return;

      enteringAR = true;
      btnEntrarAR.disabled = true;
      btnEntrarAR.textContent = 'Iniciando AR...';

      statusText.textContent = 'Iniciando Realidad Aumentada...';

      /*
        Liberamos getUserMedia justo antes de pedir immersive-ar.
        Dejamos el elemento de video visible con el último frame.
      */
      releaseScannerCameraForXR();

      try {
        const result = scene.enterAR();

        /*
          Según versión/navegador enterAR puede devolver una Promise.
          Si la sesión falla, recuperamos la cámara y permitimos reintentar.
        */
        if (result && typeof result.catch === 'function') {
          result.catch(handleARError);
        }
      } catch (error) {
        handleARError(error);
      }
    });

    function handleARError(error) {
      console.error('[WebXR] No se pudo entrar en AR:', error);

      enteringAR = false;
      btnEntrarAR.disabled = false;
      btnEntrarAR.textContent = 'Reintentar Realidad Aumentada';
      btnEntrarAR.style.display = 'block';

      statusText.textContent =
        'No se pudo iniciar WebXR. Podés tocar “Reintentar Realidad Aumentada”.';

      /*
        Volvemos a mostrar la cámara como preview.
        NO reactivamos HSV porque la tarjeta ya fue validada.
      */
      startScannerCamera(false);
    }

    scene.addEventListener('enter-vr', () => {
      if (!scene.is('ar-mode')) return;

      enteringAR = false;

      video.style.display = 'none';
      btnEntrarAR.style.display = 'none';

      console.log('[WebXR] Sesión AR iniciada correctamente.');
    });

    scene.addEventListener('exit-vr', () => {
      enteringAR = false;
    });

    document.getElementById('fallback-reload').addEventListener(
      'beforexrselect',
      event => event.preventDefault()
    );

    /*
      Inicialización.
    */
    checkWebXR().then(() => {
      startScannerCamera(true);
    });
  </script>

</body>
</html>
